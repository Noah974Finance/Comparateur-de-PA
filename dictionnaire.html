<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictionnaire des Critères PA — Facturation Électronique 2026</title>
  <meta name="description" content="Définitions simples et argumentaires de vente pour chaque critère réglementaire, technique et structurel des Plateformes Agréées (PA).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── TOKENS ── */
    :root {
      --bg:       #07090f;
      --bg1:      #0d1119;
      --bg2:      #131825;
      --bg3:      #1a2030;
      --border:   rgba(99,102,241,.10);
      --border-h: rgba(99,102,241,.28);
      --text:     #f1f3f8;
      --text2:    #8b95a8;
      --text3:    #545f73;
      --accent:   #6366f1;
      --ac-glow:  rgba(99,102,241,.18);
      --green:    #10b981;
      --green-bg: rgba(16,185,129,.10);
      --green-bd: rgba(16,185,129,.22);
      --amber:    #f59e0b;
      --amber-bg: rgba(245,158,11,.10);
      --amber-bd: rgba(245,158,11,.22);
      --blue:     #3b82f6;
      --blue-bg:  rgba(59,130,246,.10);
      --blue-bd:  rgba(59,130,246,.22);
      --purple:   #a855f7;
      --purple-bg:rgba(168,85,247,.10);
      --purple-bd:rgba(168,85,247,.22);
      --gray-bg:  rgba(107,114,128,.10);
      --gray-bd:  rgba(107,114,128,.22);
      --radius:   14px;
      --radius-s: 8px;
      --tr:       .25s cubic-bezier(.4,0,.2,1);
      --grad:     linear-gradient(135deg,#6366f1 0%,#a855f7 50%,#ec4899 100%);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-h); border-radius: 99px; }

    /* ── NAV BAR ── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(7,9,15,.85); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 56px;
    }
    .nav-brand {
      font-family: 'Outfit', sans-serif; font-weight: 800; font-size: .95rem;
      background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -.02em;
    }
    .nav-switch {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; font-size: .8rem; font-weight: 700;
      background: var(--bg2); border: 1px solid var(--border-h); color: #a5b4fc;
      cursor: pointer; text-decoration: none; transition: var(--tr);
    }
    .nav-switch:hover { background: var(--ac-glow); border-color: var(--accent); }
    .nav-tabs { display: flex; gap: 2px; }
    .nav-tab {
      padding: 6px 14px; border-radius: 7px; font-size: .8rem; font-weight: 600;
      color: var(--text2); cursor: pointer; border: none; background: none; transition: var(--tr);
      text-decoration: none;
    }
    .nav-tab.active, .nav-tab:hover { background: var(--ac-glow); color: #a5b4fc; }
    .nav-tab.active { color: #c7d2fe; }

    /* ── HERO ── */
    .hero {
      padding: 52px 24px 36px;
      background: radial-gradient(ellipse at 50% -10%, rgba(99,102,241,.16) 0%, transparent 60%);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .hero h1 {
      font-family: 'Outfit', sans-serif; font-size: clamp(1.9rem,4.5vw,3.2rem);
      font-weight: 900; letter-spacing: -.04em; line-height: 1.1;
      background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .hero-sub { color: var(--text2); font-size: clamp(.9rem,2vw,1.05rem); max-width: 680px; margin: 0 auto 16px; }

    /* ── CONTROLS ── */
    .controls {
      max-width: 1400px; margin: 0 auto;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      padding: 18px 24px;
    }
    .search-wrap { position: relative; flex: 1; min-width: 220px; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: .95rem; pointer-events: none; }
    .search-inp {
      width: 100%; background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius-s); padding: 10px 14px 10px 40px;
      color: var(--text); font-family: inherit; font-size: .87rem; outline: none; transition: var(--tr);
    }
    .search-inp::placeholder { color: var(--text3); }
    .search-inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ac-glow); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      padding: 8px 14px; border-radius: 7px; font-size: .78rem; font-weight: 700;
      border: 1px solid var(--border); background: var(--bg2); color: var(--text2);
      cursor: pointer; transition: var(--tr);
    }
    .chip:hover { border-color: var(--accent); color: #a5b4fc; }
    .chip.on { background: var(--ac-glow); border-color: var(--accent); color: #c7d2fe; }
    .count { color: var(--text3); font-size: .78rem; font-weight: 700; padding: 8px 4px; white-space: nowrap; }

    /* ── GRID ── */
    .grid {
      max-width: 1400px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(360px,1fr));
      gap: 16px; padding: 0 24px 60px;
    }

    /* ── CARD ── */
    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
      position: relative; overflow: hidden; transition: var(--tr);
    }
    .card::before {
      content:''; position: absolute; top:0; left:0; right:0; height: 2px;
      background: var(--grad); opacity: 0; transition: opacity .3s;
    }
    .card:hover { border-color: var(--border-h); transform: translateY(-2px); box-shadow: 0 10px 32px rgba(0,0,0,.5); }
    .card:hover::before { opacity: 1; }

    .badge {
      align-self: start;
      font-size: .65rem; font-weight: 800; padding: 3px 9px; border-radius: 6px;
      text-transform: uppercase; letter-spacing: .05em;
    }
    .badge-general { background: var(--blue-bg); color: #60a5fa; border: 1px solid var(--blue-bd); }
    .badge-facturation { background: var(--purple-bg); color: #c084fc; border: 1px solid var(--purple-bd); }
    .badge-services { background: var(--green-bg); color: #34d399; border: 1px solid var(--green-bd); }
    .badge-interoperabilite { background: var(--amber-bg); color: #fbbf24; border: 1px solid var(--amber-bd); }
    .badge-certification { background: var(--gray-bg); color: #f87171; border: 1px solid var(--gray-bd); }
    .badge-autres { background: var(--gray-bg); color: #9ca3af; border: 1px solid var(--gray-bd); }

    .term {
      font-family: 'Outfit', sans-serif; font-size: 1.15rem; font-weight: 800;
      color: var(--text);
    }
    .definition {
      font-size: .88rem; color: var(--text2); line-height: 1.5;
    }
    .example {
      font-size: .82rem; color: var(--text3);
      background: rgba(255, 255, 255, 0.02);
      padding: 10px; border-radius: var(--radius-s);
      border-left: 2px solid var(--border-h);
    }
    .pitch-box {
      background: var(--ac-glow); border: 1px dashed rgba(99, 102, 241, 0.3);
      border-radius: var(--radius-s); padding: 12px;
      font-size: .85rem; color: #c7d2fe; margin-top: auto;
    }
    .pitch-title {
      font-family: 'Outfit', sans-serif; font-weight: 700; font-size: .72rem;
      text-transform: uppercase; letter-spacing: .06em; color: #a5b4fc;
      margin-bottom: 4px;
    }

    .empty { text-align: center; padding: 60px; color: var(--text3); grid-column: 1/-1; }
    .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }

    @media(max-width:600px){
      .controls { flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

es données sans saisie manuelle.", "pitch": "C'est le format recommandé de la réforme : il permet à la fois de lire visuellement la facture comme d'habitude et de l'automatiser instantanément pour vos destinataires."}, {"term": "Création / Transformation CII / UBL", "category": "Facturation", "definition": "Formats de factures purement structurés en données (fichiers XML sans rendu visuel par défaut), utilisés principalement pour les échanges automatisés complexes de gros volumes.", "example": "Les échanges en EDI (Échange de Données Informatisé) entre grands industriels ou acteurs de la distribution.", "pitch": "Ces formats sont obligatoires si vous travaillez avec de grands groupes ou des réseaux d'achats industriels qui automatisent entièrement leur chaîne de facturation."}, {"term": "Saisie en ligne des factures", "category": "Facturation", "definition": "Interface permettant de saisir manuellement les données de facturation directement sur le portail internet de la plateforme pour éditer une facture.", "example": "Vous remplissez le nom du client, les articles et les montants sur le site de la PA pour générer immédiatement la facture conforme.", "pitch": "Utile si vous émettez peu de factures par mois : pas besoin d'acheter un logiciel de facturation complet, vous pouvez tout faire directement et gratuitement en ligne."}, {"term": "Workflow de validation des factures", "category": "Facturation", "definition": "Circuit d'approbation permettant de faire valider une facture par différents responsables internes avant son envoi.", "example": "Une facture fournisseur reçue doit être validée par le chef de chantier, puis par le directeur financier, avant d'être payée.", "pitch": "Cela sécurise vos processus internes : aucune facture n'est payée ou envoyée sans avoir suivi le circuit d'approbation et de contrôle défini par votre entreprise."}, {"term": "Workflow de validation des paiements", "category": "Facturation", "definition": "Circuit d'autorisation interne assurant qu'un ordre de paiement de facture fournisseur est approuvé par les signataires habilités avant exécution bancaire.", "example": "Le comptable prépare les ordres de virement dans la plateforme, mais seul le gérant a le droit de cliquer sur 'Valider le paiement' pour déclencher les débits bancaires.", "pitch": "Indispensable pour éviter les erreurs de paiement ou les fraudes en séparant la préparation de la validation finale des transactions."}, {"term": "Factures hors périmètre e-invoicing", "category": "Facturation", "definition": "Capacité de la plateforme à traiter et transmettre les factures non assujetties à l'obligation de facturation électronique domestique.", "example": "La plateforme prend en charge la facturation vers les clients étrangers (B2B international) ou vers les particuliers (B2C) via des flux d'e-reporting.", "pitch": "Vous utilisez un outil unique pour l'ensemble de votre facturation, qu'il s'agisse de clients professionnels en France, à l'étranger, ou de clients particuliers."}, {"term": "Formats hors socle minimal", "category": "Facturation", "definition": "Support de formats de facturation électronique autres que les trois standards obligatoires Factur-X, UBL, et CII.", "example": "Intégration de formats spécifiques comme l'EDIFACT (courant dans la grande distribution et l'automobile) ou l'ODETTE.", "pitch": "Essentiel si vous avez des exigences sectorielles strictes imposées par vos donneurs d'ordres majeurs."}, {"term": "Service de paiement : Banque traditionnelle VS Néobanque", "category": "Facturation", "definition": "Différence entre les modules de paiement proposés. Les banques traditionnelles s'appuient sur des comptes physiques historiques, tandis que les néobanques proposent des comptes pro numériques intégrés.", "example": "Qonto (néobanque) intègre le compte bancaire et l'outil de facturation, alors qu'une PA classique se synchronise simplement avec une banque traditionnelle (ex: CIC, BNP) via l'agrégation bancaire.", "pitch": ement envoyé à votre client 3 jours après la date d'échéance de la facture si aucun règlement n'a été détecté.", "pitch": "Vous optimisez votre trésorerie et réduisez les impayés sans passer des heures à relancer manuellement chaque retardataire."}, {"term": "Saisie manuelle des Z de caisse", "category": "Services", "definition": "Possibilité d'enregistrer manuellement le récapitulatif quotidien des ventes d'une caisse enregistreuse (ticket Z) pour les commerces physiques.", "example": "Un commerçant saisit son chiffre d'affaires du jour en renseignant le total espèce, carte bancaire et chèque du Z de caisse de la journée.", "pitch": "Idéal pour les commerces physiques : vous centralisez dans la même plateforme vos factures clients professionnelles et vos déclarations quotidiennes de ventes comptoir."}, {"term": "Génération d'un e-Reporting normé", "category": "Services", "definition": "Transmission automatique à l'administration fiscale des données de vente B2C (particuliers) ou B2B international (hors France) requises par la réforme.", "example": "La plateforme compile les ventes de votre site e-commerce et transmet le montant global de TVA collectée directement au fisc à la fréquence légale.", "pitch": "Vous assurez votre conformité fiscale automatique pour toutes vos ventes, y compris celles qui ne nécessitent pas l'émission d'une facture électronique classique."}, {"term": "Nombre de cas d'usage gérés sur 42", "category": "Services", "definition": "Le niveau de couverture de la plateforme par rapport aux 42 cas d'usage de facturation identifiés par l'administration fiscale française.", "example": "Gestion spécifique des cas complexes comme l'autofacturation, la sous-traitance, l'affacturage, ou les factures de co-traitance.", "pitch": "Plus ce nombre est proche de 42, plus la plateforme est capable de gérer toutes les subtilités et spécificités juridiques et opérationnelles de vos transactions."}, {"term": "Module de contrôle de validité des informations", "cat function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getDictBadgeClass(cat) {
  const map = {
    'Général': 'badge-general',
    'Facturation': 'badge-facturation',
    'Services': 'badge-services',
    'Interopérabilité': 'badge-interoperabilite',
    'Certification': 'badge-certification'
  };
  return map[cat] || 'badge-autres';
}

let activeCat = 'all';

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  let list = [...DICT_DATA];

  if (activeCat !== 'all') list = list.filter(item => item.category === activeCat);
  if (q) {
    list = list.filter(item => 
      item.term.toLowerCase().includes(q) ||
      item.definition.toLowerCase().includes(q) ||
      item.example.toLowerCase().includes(q) ||
      item.pitch.toLowerCase().includes(q)
    );
  }

  document.getElementById('count').textContent = `${list.length} terme${list.length!==1?'s':''}`;
  
  const grid = document.getElementById('grid');
  grid.innerHTML = list.length 
    ? list.map(item => `
      <div class="card">
        <span class="badge ${getDictBadgeClass(item.category)}">${esc(item.category)}</span>
        <h3 class="term">${esc(item.term)}</h3>
        <p class="definition">${esc(item.definition)}</p>
        ${item.example ? `<div class="example">💡 <strong>Exemple :</strong> ${esc(item.example)}</div>` : ''}
        <div class="pitch-box">
          <div class="pitch-title">🗣️ Argumentaire Client</div>
          <div>${esc(item.pitch)}</div>
        </div>
      </div>
    `).join('')
    : `<div class="empty"><div class="empty-icon">🔍</div>Aucun résultat trouvé.</div>`;
}

document.getElementById('search').addEventListener('input', render);
document.querySelectorAll('.chip').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    activeCat = btn.dataset.cat;
    render();
  });
});

// ── IFRAME NAVIGATION COMPATIBILITY ──
const inIframe = window.self !== window.top;
if (inIframe) {
  document.querySelectorAll('a').forEach(link => {
    const href = link.getAttribute('href');
    if (href === 'prix.html' || href === 'index.html' || href === 'dictionnaire.html') {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const targetPage = href === 'prix.html' ? 'tarifs' : (href === 'dictionnaire.html' ? 'dictionnaire' : 'comparateur');
        try {
          const parentUrl = new URL(window.parent.location.href);
          parentUrl.searchParams.set('page', targetPage);
          window.parent.location.href = parentUrl.toString();
        } catch (err) {
          window.parent.location.href = "/?page=" + targetPage;
        }
      });
    }
  });
}

render();
</script>
